<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>SIO Magistrum - Inscription/Connexion Eleve</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'users/CSS/inscriptionprof.css' %}">
    <link rel="stylesheet" href="{% static 'partials/header.css' %}">
    <link rel="stylesheet" href="{% static 'partials/footer.css' %}">
</head>

<body>
    {% include 'partials/header.html' %}
    <br>
    <div class="auth-wrapper">
        <div class="auth-card" id="signup">
            <h2>Inscription</h2>
            <p>Créez un compte pour accéder aux modules</p>

            <form method="POST" enctype="multipart/form-data" action="{% url 'inscription_prof' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label>Photo de profil</label>
                    <input type="file" name="photo">
                </div>
                <div class="form-group">
                    <label for="pseudo">Nom d'utilisateur :</label>
                    <input type="text" id="pseudo" name="pseudo" placeholder="Votre nom complet" required>
                </div>
                <div class="form-group">
                    <label for="nom">Nom de Famille :</label>
                    <input type="text" id="nom" name="nom" placeholder="Votre nom complet" required>
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom :</label>
                    <input type="text" id="prenom" name="prenom" placeholder="Votre nom complet" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" placeholder="Votre email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Mot de passe</label>
                    <input type="password" id="signup-password" name="password" placeholder="Votre mot de passe"
                        required>
                </div>
                <div class="form-group">
                    <label for="signup-password2">Confirmer le mot de passe</label>
                    <input type="password" id="signup-password2" name="password2"
                        placeholder="Confirmez le mot de passe" required>
                </div>
                <div class="form-group">
                    <label for="matières">Matières enseignées</label>
                    <select name="matieres" id="matieres" multiple required>
                        {% for matiere in form.fields.matieres.queryset %}
                        <option value="{{ matiere.id }}">{{ matiere.nom }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="auth-btn">S'inscrire</button>
            </form>
            <p class="auth-switch">
                <a href="{% url 'login_prof' %}">Déjà inscrit ? Connectez-vous</a>
            </p>
        </div>
    </div>
    {% include 'partials/footer.html' %}
</body>
</html>
